/* ---------------- SafeImg: multi-source fallback + branded placeholder ----------------
   `sources` is an array of candidate URLs tried in order (.jpg/.jpeg/.png/.webp).
   If every candidate fails, renders a styled brand placeholder — never a broken
   image icon or raw alt text. fit="cover" (default) or "contain". */
function SafeImg({sources, alt, className='', imgClassName='', fit='cover', label}) {
  const list = Array.isArray(sources) ? sources : [sources];
  const key = list.join('|');
  const [idx, setIdx] = useState(0);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setIdx(0); setFailed(false); }, [key]);
  if (failed || idx >= list.length) {
    return (
      <div className={'flex flex-col items-center justify-center gap-3 bg-gradient-to-br from-[#06323F] to-[#0B7FA4] text-center ' + className}
        role="img" aria-label={alt}>
        <span className="flex h-14 w-14 items-center justify-center rounded-2xl border border-white/20 bg-white/10 text-white">
          <Icon name="spray" size={26} />
        </span>
        <span className="px-4 text-xs font-semibold uppercase tracking-[0.2em] text-soft">
          {label || 'ORISON CAR CARE'}
        </span>
      </div>
    );
  }
  return (
    <img src={list[idx]} alt={alt} loading="lazy" decoding="async"
      onError={() => { if (idx + 1 < list.length) setIdx(idx + 1); else setFailed(true); }}
      className={imgClassName}
      style={fit === 'cover'
        ? {width:'100%', height:'100%', display:'block', objectFit:'cover', objectPosition:'center'}
        : {width:'100%', height:'100%', display:'block', objectFit:'contain', objectPosition:'center'}} />
  );
}

/* ---------------- Animation primitives ---------------- */
function FadeInUp({children, delay=0, y=40, className=''}) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVis(true); io.disconnect(); }
    }, {threshold: 0.12, rootMargin: '0px 0px -40px 0px'});
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} className={className}
      style={{opacity: vis ? 1 : 0, transform: vis ? 'translateY(0)' : 'translateY(' + y + 'px)',
        transition: 'opacity 1000ms cubic-bezier(.16,1,.3,1) ' + delay + 'ms, transform 1000ms cubic-bezier(.16,1,.3,1) ' + delay + 'ms',
        willChange: 'opacity, transform'}}>
      {children}
    </div>
  );
}

/* ---------------- Stats ---------------- */
function Counter({to, duration=1800}) {
  const ref = useRef(null);
  const started = useRef(false);
  const [v, setV] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started.current) {
        started.current = true;
        const t0 = performance.now();
        const tick = t => {
          const p = Math.min(1, (t - t0) / duration);
          setV(Math.round(to * (1 - Math.pow(1 - p, 3))));
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        io.disconnect();
      }
    }, {threshold: 0.4});
    io.observe(el);
    return () => io.disconnect();
  }, [to, duration]);
  return <span ref={ref}>{v}</span>;
}
function Stats() {
  return (
    <section aria-label="Our track record" className="border-y border-white/5 bg-panel">

  );
}

/* ---------------- Before / After slider (falls back to Gallery filenames) ---------------- */
function BeforeAfter({beforeSrcs, afterSrcs, beforeAlt, afterAlt}) {
  const ref = useRef(null);
  const dragging = useRef(false);
  const [pos, setPos] = useState(50);
  const update = clientX => {
    const r = ref.current.getBoundingClientRect();
    setPos(Math.min(96, Math.max(4, ((clientX - r.left) / r.width) * 100)));
  };
  return (
    <div ref={ref}
      className="relative aspect-[16/10] w-full cursor-ew-resize select-none overflow-hidden rounded-3xl border border-white/10 touch-none"
      role="slider" tabIndex={0} aria-label="Before and after comparison" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(pos)}
      onPointerDown={e => { dragging.current = true; ref.current.setPointerCapture(e.pointerId); update(e.clientX); }}
      onPointerMove={e => { if (dragging.current) update(e.clientX); }}
      onPointerUp={() => { dragging.current = false; }}
      onKeyDown={e => {
        if (e.key === 'ArrowLeft') setPos(p => Math.max(4, p - 4));
        if (e.key === 'ArrowRight') setPos(p => Math.min(96, p + 4));
      }}>
      <div className="absolute inset-0">
        <SafeImg sources={afterSrcs} fit="cover" alt={afterAlt} label="After" />
      </div>
      <div className="absolute inset-0" style={{clipPath: 'inset(0 ' + (100 - pos) + '% 0 0)'}}>
        <SafeImg sources={beforeSrcs} fit="cover" alt={beforeAlt} label="Before" />
      </div>
      <span className="absolute left-4 top-4 rounded-full border border-white/10 bg-black/60 px-3 py-1 text-[10px] uppercase tracking-[0.25em] text-white backdrop-blur">Before</span>
      <span className="absolute right-4 top-4 rounded-full border border-white/10 bg-black/60 px-3 py-1 text-[10px] uppercase tracking-[0.25em] text-white backdrop-blur">After</span>
      <div className="absolute inset-y-0" style={{left: pos + '%'}}>
        <div className="absolute inset-y-0 -ml-px w-0.5 bg-white/90"></div>
        <div className="absolute top-1/2 flex h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-white/20 bg-white text-black shadow-xl">
          <Icon name="drag" size={18} sw={2.2} />
        </div>
      </div>
    </div>
  );
}

/* ---------------- Floating WhatsApp + Toast ---------------- */
function WhatsAppButton() {
  return (
    <a href={WA_DEFAULT} target="_blank" rel="noopener" aria-label="Chat on WhatsApp"
      className="group fixed bottom-5 right-5 z-[60] flex h-14 w-14 items-center justify-center">

        <Icon name="wa" size={26} />

        Chat on WhatsApp
      </span>
    </a>
  );
}
function Toast({msg}) {
  if (!msg) return null;
  return (
    <div className="fade-in fixed bottom-24 left-1/2 z-[90] flex -translate-x-1/2 items-center gap-2.5 whitespace-nowrap rounded-full border border-white/10 bg-panel px-5 py-3 text-sm text-white shadow-2xl" role="status">
      <span className="flex h-5 w-5 items-center justify-center rounded-full bg-accent/20 text-accent"><Icon name="check" size={11} sw={2.6} /></span>
      {msg}
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [modalSvc, setModalSvc] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const showToast = m => {
    setToast(m);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3800);
  };
  const bookService = svc => {
    setModalSvc(null);
    const msg = "Hi ORISON CAR CARE! I'd like to book: " + svc.name + ". Please share availability and an estimate.";
    window.open(WA_BASE + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
    showToast('"' + svc.name + '" — opening WhatsApp to confirm your booking…');
  };
  return (
    <React.Fragment>
      <a href="#home" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-accent focus:px-4 focus:py-2 focus:text-sm focus:text-ink">Skip to content</a>
      <Navbar />
      <main>
        <Hero />
        <Marquee />
        <Stats />
        <About />
        <Services onLearn={setModalSvc} />
        <Featured />
        <BeforeAfterSection />
        <Why />
        <Process />
        <Gallery />
        <Testimonials />
        <FAQ />
        <Contact />
      </main>
      <Footer />
      <WhatsAppButton />
      <ServiceModal svc={modalSvc} onClose={() => setModalSvc(null)} onBook={bookService} />
      <Toast msg={toast} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
